name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 22 is the floor and 24 is what developers run. Not 20: packages/host
      # imports node:sqlite, which landed in Node 22.5.0, so a Node 20 leg
      # cannot pass however green the rest of the workspace is. The roadmap's
      # "Node 20/22" predates that dependency — see the commit message.
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first, and not as a style preference. `typecheck` is `tsc --noEmit`
      # per package; host and web import @lorahome/protocol, whose .d.ts files
      # only exist once protocol has been built. On a developer machine there is
      # usually a stale dist/ lying around so typecheck-first appears to work —
      # on a clean checkout it fails with "Cannot find module '@lorahome/protocol'".
      - name: Build
        run: pnpm -r build

      # The generated header is intentionally untracked (R0.3), so a fresh clone
      # does not have it and anything that reads it must run after this.
      - name: Generate C header
        run: pnpm gen:c

      - name: Typecheck
        run: pnpm -r typecheck

      # A cycle between protocol/host/components is the failure mode that turns
      # the "single source of truth" into a knot nobody can refactor. Cheap to
      # check, expensive to unpick later.
      - name: Circular import check
        run: pnpm check:circular

      - name: Test
        run: pnpm -r test

  # Firmware compilation and the metric gate live in one job on purpose: both
  # need the ESP cross toolchains, and those are ~200 MB. Split across two jobs
  # they get restored twice to do one job's worth of work. `pnpm bench:all`
  # invokes compile-targets, so the gate's targets.compiled_clean only reads 3/3
  # where the toolchains are actually present.
  firmware-and-metrics:
    name: firmware headers + metric gate
    runs-on: ubuntu-latest

    steps:
      # Need the parent commit so the gate can diff against the baseline as it
      # stood before this change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Clean-checkout ordering: the protocol tests read the generated header,
      # which no fresh clone has until gen:c runs.
      - name: Build and generate C header
        run: pnpm -r build && pnpm gen:c

      # Risk R0.3: a hand edit to the generated header silently desynchronises
      # TS and C. Regenerate, then require the bytes to match.
      - name: Drift check
        run: pnpm gen:c:check

      # Cache the ESP cross toolchains — they are ~200 MB and change rarely.
      # Key bumped to v2: the espressif32 platform and RadioLib were added for
      # the firmware link step below, so a v1 cache would restore a tree
      # missing both and the install step would fetch them on every run.
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-toolchains-xtensa-s3-riscv32-esp32-v2

      - name: Install ESP toolchains
        run: |
          pipx install platformio
          pio pkg install -g -t toolchain-xtensa-esp32s3
          pio pkg install -g -t toolchain-riscv32-esp
          pio pkg install -g -p espressif32

      # Compiles the generated header on three ABIs. The _Static_asserts are
      # inert text until a compiler reads them; this is what makes them a gate.
      - name: Compile generated header on all targets
        run: node tools/compile-targets.mjs

      # Builds the firmware's C self-tests and actually runs them: 10k SLIP
      # round trips and a million fuzz iterations, once at -O2 for the timings
      # and once under ASAN+UBSAN for the memory-safety claim. Run as its own
      # step rather than left to `bench:all`, because the collector deliberately
      # keeps going when a step fails — it is gathering numbers, not gating.
      - name: Native firmware self-tests (incl. sanitized fuzz run)
        run: node tools/run-native.mjs

      # Compiling translation units one at a time proves the C is sound; it does
      # not prove the images link, and it says nothing about the two §0.6
      # budgets that are properties of the whole image (static RAM, flash).
      # Only the esp32dev environments — firmware/node also declares a `native`
      # env for host unit tests, which is not what this measures.
      - name: Link firmware images and check size budgets
        run: node tools/build-firmware.mjs

      # ubuntu-latest ships gcc, so the host x86-64 ABI and the native
      # cross-language CRC comparison both run here — neither can run on a
      # developer machine without a host toolchain.
      - name: Cross-language CRC vectors (C vs TypeScript)
        run: pnpm --filter @lorahome/protocol test

      - name: Independent vector check (Python)
        run: python3 tools/verify-crc-vectors.py

      - name: Run all benchmarks
        run: pnpm bench:all

      - name: Gate the commit against the baseline
        run: |
          git log -1 --pretty=%B > /tmp/commit-msg.txt
          pnpm --filter @lorahome/tools build
          node tools/dist/src/metric-gate-cli.js \
            --commit-msg /tmp/commit-msg.txt \
            --metrics bench/results/latest.log \
            --latest bench/results/latest.json
