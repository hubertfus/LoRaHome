; PlatformIO project for the Node firmware (end-device: sensors/actuators).
; See ARCHITECTURE.md §4 (NVS A/B config lifecycle) and CONTRIBUTING.md §1
; (no dynamic allocation, static driver vtable).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../common
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
    -std=gnu++17
    -DLORAHOME_MAX_COMPONENTS=8
    -DLORAHOME_MAX_RULES=16

; Native environment: runs firmware/common's pure logic (protocol, CRC16,
; SLIP, rule evaluator) as host-native unit tests, no ESP32 hardware needed.
; See CONTRIBUTING.md §4.
[env:native]
platform = native
lib_deps =
    symlink://../common
build_flags =
    -std=gnu++17
test_build_src = no
